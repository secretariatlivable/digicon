# DigiCon — Netlify production deployment configuration.
# Vite + React + TypeScript SPA.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # DigiCon is standardized on the current Node 24 LTS build line.
  # Netlify resolves "24" to the latest available Node 24.x release.
  NODE_VERSION = "24"

  # Keep the npm version aligned with the Node 24 build environment and
  # package.json packageManager field.
  NPM_VERSION = "11.19.0"

  # Vite, TypeScript and ESLint are devDependencies and are required during
  # the production build. Explicitly include them during Netlify install.
  NPM_FLAGS = "--include=dev"

# ---------------------------------------------------------------------------
# SPA fallback for React Router.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Caching
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"

    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' https://www.paypal.com https://*.paypal.com https://app.secureprivacy.ai;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob: https://*.supabase.co https://*.paypal.com;
      font-src 'self' data:;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api-m.paypal.com https://www.paypal.com https://*.paypal.com https://app.secureprivacy.ai;
      frame-src https://www.paypal.com https://*.paypal.com;
      form-action 'self';
      base-uri 'self';
      object-src 'none';
      frame-ancestors 'none';
      upgrade-insecure-requests;
    """
