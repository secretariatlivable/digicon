# DigiCon — Supabase local development and function configuration.
#
# `project_id` is required by the Supabase CLI. It was previously absent, so
# `supabase start` and `supabase link` both failed against this repository.
# Replace the value with your own project ref.
project_id = "digicon"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://digicon.cards", "http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# ---------------------------------------------------------------------------
# Edge Functions
# ---------------------------------------------------------------------------
#
# Wallet endpoints previously ran with `verify_jwt = false`. They query with the
# service-role key, so an unauthenticated caller who guessed a card UUID could
# mint signed passes, and each call performed expensive signing work. Pass
# issuance is an owner-only, paid action, so JWT verification is now required
# and the handlers additionally check ownership and subscription status.

[functions.apple-wallet-pass]
verify_jwt = true

[functions.google-wallet-pass]
verify_jwt = true

[functions.paypal-create-subscription]
verify_jwt = true

# The PayPal webhook is the one legitimate exception: PayPal cannot present a
# Supabase JWT. Authenticity is established by verifying PayPal's own signature
# against PAYPAL_WEBHOOK_ID inside the handler, which is mandatory there.
[functions.paypal-webhook]
verify_jwt = false
