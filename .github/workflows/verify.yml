name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # package.json and package-lock.json are currently from different dependency generations.\n      # Reconcile dependencies without requiring a clean npm-ci lockfile match.\n      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx eslint .
      - run: npx vite build
        env:
          # Build-time placeholders only. These are never used at runtime and
          # are not secrets — real values come from the hosting environment.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

  migrations:
    name: Migration and RLS assertions
    runs-on: ubuntu-latest

    # Catches policy and trigger regressions before they reach a Supabase
    # project. See supabase/tests/README.md for scope and limitations.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run migration tests
        run: bash ./supabase/tests/run.sh
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
